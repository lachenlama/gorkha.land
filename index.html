    <title>gorkha.land — the hills, going digital</title>
    <!-- The disc, drawn geometrically: a Devanagari glyph would depend on the
         viewer's system having a Devanagari font. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231E3D2F'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23C9A227' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23C9A227'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,600;1,400&family=Tiro+Devanagari+Hindi:ital@0;1&family=Kalam:wght@400;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#1E3D2F" />
    <meta
      name="description"
      content="A digital movement for the Darjeeling hills: built here, curated by people from here. Read the note and share your idea."
    />

    <!-- Link previews. A link sent on WhatsApp with no preview reads as spam,
         so this is load-bearing for sharing, not decoration. These URLs are
         absolute on purpose — WhatsApp and most scrapers won't resolve a relative
         og:image. Keep them on gorkha.land, the canonical host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gorkhaland" />
    <meta property="og:title" content="गोर्खाल्याण्ड · The hills are going digital" />
    <meta
      property="og:description"
      content="On our own terms. Built here, curated by people from here. Read the note and leave yours."
    />
    <meta property="og:image" content="https://gorkha.land/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Darjeeling hills at blue hour, town lights coming on below Kanchenjunga." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
